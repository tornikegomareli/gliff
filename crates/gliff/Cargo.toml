[package]
name = "gliff"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio = { workspace = true }
gtk4.workspace = true
libadwaita.workspace = true
gliff-proto.workspace = true
gliff-transport.workspace = true
gliff-sw.workspace = true
bytes.workspace = true
drm-fourcc.workspace = true
hypr-ipc.workspace = true
serde.workspace = true
toml = "1"

# The GPU tier and the compositor keymap exist only on Linux.
[target.'cfg(target_os = "linux")'.dependencies]
gliff-vk.workspace = true
hypr-capture.workspace = true
hypr-input.workspace = true

# The event tap that captures Command shortcuts, and the menu bar item, on
# macOS.
[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"
core-foundation = "0.10"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
